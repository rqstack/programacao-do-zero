# Roda verificação de tipos, lint e testes em PRs (inclusive do Dependabot) e no push da main.
# Gratuito para repositório público. Sem segredos: os testes usam um Postgres embutido.
name: Testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Tipos das rotas e next-env.d.ts são gerados (e ignorados pelo Git): crie antes de checar.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
