# Atualizações de dependências (gratuito no GitHub). Os PRs NÃO entram sozinhos:
# o workflow "Testes" roda em cada PR e o merge é decisão do dono do projeto.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      # Atualizações pequenas juntas num PR só; versões maiores vêm separadas para revisar.
      dependencias-menores:
        update-types: ["minor", "patch"]
    labels: ["dependencias"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
